<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>告警处理 - 能碳管理平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #F5F5F5; }
        .sidebar { width: 220px; background: #001529; position: fixed; height: 100vh; overflow-y: auto; z-index: 100; }
        .sidebar-logo { height: 64px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-logo i { font-size: 24px; color: #52C41A; margin-right: 10px; }
        .sidebar-logo span { color: white; font-size: 16px; font-weight: 600; }
        .sidebar-menu { padding: 12px 0; }
        .menu-group { margin-bottom: 4px; }
        .menu-group-header { padding: 10px 20px; color: rgba(255,255,255,0.65); cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 15px; transition: all 0.3s; user-select: none; }
        .menu-group-header:hover { background: rgba(255,255,255,0.08); color: white; }
        .menu-group-header.active { color: white; }
        .menu-group-header i.menu-arrow { font-size: 10px; transition: transform 0.3s; }
        .menu-group-header.active i.menu-arrow { transform: rotate(90deg); }
        .menu-group-content { overflow: hidden; max-height: 0; transition: max-height 0.3s ease-out; }
        .menu-group-content.open { max-height: 500px; }
        .sidebar-item { padding: 10px 20px 10px 50px; color: rgba(255,255,255,0.65); cursor: pointer; display: flex; align-items: center; transition: all 0.3s; font-size: 14px; }
        .sidebar-item:hover { background: rgba(255,255,255,0.08); color: white; }
        .sidebar-item.active { background: #1890FF; color: white; }
        .sidebar-item i { width: 20px; margin-right: 10px; font-size: 14px; }
        .sidebar-item span { font-size: 14px; }
        .main-content { margin-left: 220px; min-height: 100vh; }
        .topbar { height: 64px; background: white; border-bottom: 1px solid #E8E8E8; display: flex; align-items: center; padding: 0 24px; }
        .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .breadcrumb span { color: #262626; }
        .user-avatar { width: 36px; height: 36px; background: linear-gradient(135deg, #1890FF, #52C41A); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; cursor: pointer; margin-left: auto; }
        .page-content { padding: 24px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
        .card-header { padding: 16px 20px; border-bottom: 1px solid #E8E8E8; display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 16px; font-weight: 600; color: #262626; }
        .card-body { padding: 20px; }
        .btn { height: 36px; padding: 0 20px; border-radius: 6px; font-size: 14px; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 6px; border: none; }
        .btn-primary { background: #1890FF; color: white; }
        .btn-success { background: #52C41A; color: white; }
        .btn-outline { background: white; color: #595959; border: 1px solid #D9D9D9; }
        .alarm-detail { background: #FAFAFA; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .detail-row { display: flex; margin-bottom: 12px; }
        .detail-label { width: 100px; color: #8C8C8C; font-size: 14px; }
        .detail-value { flex: 1; color: #262626; font-size: 14px; font-weight: 500; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 14px; color: #595959; margin-bottom: 8px; }
        .form-textarea { width: 100%; border: 1px solid #D9D9D9; border-radius: 6px; padding: 12px; font-size: 14px; min-height: 120px; resize: vertical; }
        .radio-group { display: flex; gap: 24px; }
        .radio-item { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th { background: #FAFAFA; padding: 12px 16px; text-align: left; font-size: 12px; color: #8C8C8C; font-weight: 500; border-bottom: 1px solid #E8E8E8; }
        .data-table td { padding: 14px 16px; font-size: 14px; color: #262626; border-bottom: 1px solid #F0F0F0; }
        .status-tag { display: inline-block; padding: 2px 8px; border-radius: 2px; font-size: 12px; }
        .status-tag.completed { background: #F6FFED; color: #52C41A; }
    </style>
</head>
<body>
    <!-- 侧边栏导航 -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-logo">
            <i class="fa-solid fa-leaf"></i>
            <span>能碳管理平台</span>
        </div>
        <div class="sidebar-menu">
            <!-- 导航由 sidebar-nav.js 自动渲染 -->
        </div>
        <script src="sidebar-nav.js"></script>
        <script>initSidebarNav();</script>
    </aside>
    <div class="main-content">
        <div class="topbar">
            <div class="breadcrumb"><a href="P02-dashboard.html"><i class="fa-solid fa-home"></i></a><span>/</span><span>告警中心</span><span>/</span><span>告警处理</span></div>
            <div class="user-avatar">管</div>
        </div>
        <div class="page-content">
            <div class="grid grid-cols-3 gap-6">
                <div class="col-span-2">
                    <div class="card">
                        <div class="card-header"><span class="card-title">处理告警：1号配电室电表数据异常</span></div>
                        <div class="card-body">
                            <div class="alarm-detail">
                                <div class="detail-row"><span class="detail-label">告警级别</span><span class="detail-value"><span class="text-red-500 font-bold">紧急</span></span></div>
                                <div class="detail-row"><span class="detail-label">告警内容</span><span class="detail-value">1号配电室电表数据异常，当前值1200kWh，超限200kWh</span></div>
                                <div class="detail-row"><span class="detail-label">发生时间</span><span class="detail-value">2026-04-28 10:30:25</span></div>
                                <div class="detail-row"><span class="detail-label">监测点</span><span class="detail-value">1号电表(A栋1层)</span></div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">处理方式</label>
                                <div class="radio-group">
                                    <label class="radio-item"><input type="radio" name="handleType" checked> 确认处理</label>
                                    <label class="radio-item"><input type="radio" name="handleType"> 转派他人</label>
                                    <label class="radio-item"><input type="radio" name="handleType"> 升级处理</label>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">处理备注</label>
                                <textarea class="form-textarea" placeholder="请输入处理备注...">已联系物业检查，确认是由于空调机组启动导致的瞬时功率波动。已通知租户注意用电。</textarea>
                            </div>
                            <div class="flex gap-3">
                                <button class="btn btn-success"><i class="fa-solid fa-check"></i> 提交处理</button>
                                <button class="btn btn-outline"><i class="fa-solid fa-times"></i> 取消</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div>
                    <div class="card">
                        <div class="card-header"><span class="card-title">处理历史记录</span></div>
                        <div class="card-body" style="padding:0;">
                            <table class="data-table">
                                <thead><tr><th>时间</th><th>处理人</th><th>方式</th><th>状态</th></tr></thead>
                                <tbody>
                                    <tr><td>2026-04-28 11:00</td><td>管理员</td><td>确认处理</td><td><span class="status-tag completed">已完成</span></td></tr>
                                    <tr><td>2026-04-28 10:35</td><td>张明</td><td>确认处理</td><td><span class="status-tag completed">已完成</span></td></tr>
                                    <tr><td>2026-04-28 10:30</td><td>系统</td><td>自动告警</td><td><span class="status-tag completed">已触发</span></td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
