<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>碳历史数据 - 能碳管理平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #F5F5F5; }
        .sidebar { width: 220px; background: #001529; position: fixed; height: 100vh; overflow-y: auto; z-index: 100; }
        .sidebar-logo { height: 64px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-logo i { font-size: 24px; color: #52C41A; margin-right: 10px; }
        .sidebar-logo span { color: white; font-size: 16px; font-weight: 600; }
        .sidebar-menu { padding: 12px 0; }
        .menu-group { margin-bottom: 4px; }
        .menu-group-header { padding: 10px 20px; color: rgba(255,255,255,0.65); cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 15px; transition: all 0.3s; user-select: none; }
        .menu-group-header:hover { background: rgba(255,255,255,0.08); color: white; }
        .menu-group-header.active { color: white; }
        .menu-group-header i.menu-arrow { font-size: 10px; transition: transform 0.3s; }
        .menu-group-header.active i.menu-arrow { transform: rotate(90deg); }
        .menu-group-content { overflow: hidden; max-height: 0; transition: max-height 0.3s ease-out; }
        .menu-group-content.open { max-height: 500px; }
        .sidebar-item { padding: 10px 20px 10px 50px; color: rgba(255,255,255,0.65); cursor: pointer; display: flex; align-items: center; transition: all 0.3s; font-size: 14px; }
        .sidebar-item:hover { background: rgba(255,255,255,0.08); color: white; }
        .sidebar-item.active { background: #1890FF; color: white; }
        .sidebar-item i { width: 20px; margin-right: 10px; font-size: 14px; }
        .sidebar-item span { font-size: 14px; }
        .main-content { margin-left: 220px; min-height: 100vh; }
        .topbar { height: 64px; background: white; border-bottom: 1px solid #E8E8E8; display: flex; align-items: center; padding: 0 24px; }
        .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .breadcrumb span { color: #262626; }
        .user-avatar { width: 36px; height: 36px; background: linear-gradient(135deg, #1890FF, #52C41A); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; cursor: pointer; margin-left: auto; }
        .page-content { padding: 24px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
        .card-header { padding: 16px 20px; border-bottom: 1px solid #E8E8E8; display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 16px; font-weight: 600; color: #262626; }
        .card-body { padding: 20px; }
        .stat-card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); text-align: center; }
        .stat-value { font-size: 28px; font-weight: 700; color: #52C41A; }
        .stat-label { font-size: 14px; color: #8C8C8C; margin-top: 8px; }
        .filter-bar { display: flex; gap: 12px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
        .filter-select { height: 36px; border: 1px solid #D9D9D9; border-radius: 6px; padding: 0 12px; min-width: 140px; font-size: 14px; }
        .btn { height: 36px; padding: 0 20px; border-radius: 6px; font-size: 14px; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 6px; border: none; }
        .btn-primary { background: #1890FF; color: white; }
        .btn-outline { background: white; color: #595959; border: 1px solid #D9D9D9; }
        .chart-container { height: 300px; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th { background: #FAFAFA; padding: 12px 16px; text-align: left; font-size: 12px; color: #8C8C8C; font-weight: 500; border-bottom: 1px solid #E8E8E8; }
        .data-table td { padding: 14px 16px; font-size: 14px; color: #262626; border-bottom: 1px solid #F0F0F0; }
        .data-table tr:hover { background: #F5F5F5; }
    </style>
</head>
<body>
    <!-- 侧边栏导航 -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-logo">
            <i class="fa-solid fa-leaf"></i>
            <span>能碳管理平台</span>
        </div>
        <div class="sidebar-menu">
            <!-- 导航由 sidebar-nav.js 自动渲染 -->
        </div>
        <script src="sidebar-nav.js"></script>
        <script>initSidebarNav();</script>
    </aside>
    <div class="main-content">
        <div class="topbar">
            <div class="breadcrumb"><a href="P02-dashboard.html"><i class="fa-solid fa-home"></i></a><span>/</span><span>碳管理</span><span>/</span><span>历史数据</span></div>
            <div class="user-avatar">管</div>
        </div>
        <div class="page-content">
            <div class="card mb-6">
                <div class="card-body">
                    <div class="filter-bar">
                        <select class="filter-select"><option>全部租户</option><option>A科技有限公司</option><option>B商贸公司</option></select>
                        <select class="filter-select"><option>2026年</option><option>2025年</option></select>
                        <button class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
                        <button class="btn btn-outline"><i class="fa-solid fa-download"></i> 导出</button>
                    </div>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-6 mb-6">
                <div class="stat-card"><div class="stat-value">49,380</div><div class="stat-label">本年累计碳排放(tCO₂)</div></div>
                <div class="stat-card"><div class="stat-value">12,345</div><div class="stat-label">本月碳排放(tCO₂)</div></div>
                <div class="stat-card"><div class="stat-value">0.85</div><div class="stat-label">碳排放强度(t/㎡)</div></div>
            </div>
            <div class="card mb-6">
                <div class="card-header"><span class="card-title">月度碳排放趋势</span></div>
                <div class="card-body"><div id="trendChart" class="chart-container"></div></div>
            </div>
            <div class="card">
                <div class="card-header"><span class="card-title">历史数据明细</span></div>
                <div class="card-body" style="padding:0;">
                    <table class="data-table">
                        <thead><tr><th>周期</th><th>租户</th><th>电力(t)</th><th>天然气(t)</th><th>其他(t)</th><th>合计(t)</th><th>同比变化</th></tr></thead>
                        <tbody>
                            <tr><td>2026-04</td><td>全部</td><td>20.83</td><td>2.67</td><td>1.42</td><td class="font-medium">24.92</td><td class="text-green-500"><i class="fa-solid fa-arrow-down"></i> 8.5%</td></tr>
                            <tr><td>2026-03</td><td>全部</td><td>19.56</td><td>2.54</td><td>1.35</td><td class="font-medium">23.45</td><td class="text-green-500"><i class="fa-solid fa-arrow-down"></i> 5.2%</td></tr>
                            <tr><td>2026-02</td><td>全部</td><td>18.23</td><td>2.45</td><td>1.28</td><td class="font-medium">21.96</td><td class="text-green-500"><i class="fa-solid fa-arrow-down"></i> 3.1%</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var chart = echarts.init(document.getElementById('trendChart'));
            chart.setOption({
                tooltip: { trigger: 'axis' },
                legend: { data: ['碳排放量', '同比变化率'], bottom: 0 },
                grid: { left: '3%', right: '4%', bottom: '18%', top: '3%', containLabel: true },
                xAxis: { type: 'category', data: ['5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月', '1月', '2月', '3月', '4月'], axisLine: { lineStyle: { color: '#E8E8E8' } } },
                yAxis: [{ type: 'value', name: 'tCO₂', axisLine: { show: false }, splitLine: { lineStyle: { color: '#F0F0F0' } } }, { type: 'value', name: '%', axisLine: { show: false }, splitLine: { show: false } }],
                series: [{ name: '碳排放量', type: 'bar', data: [14200, 13800, 13500, 13200, 12800, 12500, 12300, 12100, 12000, 11800, 12300, 12345], itemStyle: { color: '#52C41A', borderRadius: [4, 4, 0, 0] }, barWidth: '50%' }, { name: '同比变化率', type: 'line', yAxisIndex: 1, data: [-5.2, -4.8, -6.1, -5.5, -7.2, -6.8, -8.1, -7.5, -8.0, -6.5, -5.2, -8.5], itemStyle: { color: '#FA8C16' }, smooth: true }]
            });
            window.addEventListener('resize', function() { chart.resize(); });
        });
    </script>

</body>
</html>
