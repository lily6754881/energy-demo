<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>能碳管理平台 - 登录</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #001529 0%, #003a70 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 48px;
            width: 420px;
            max-width: 90%;
        }
        .logo-area {
            text-align: center;
            margin-bottom: 40px;
        }
        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #1890FF, #52C41A);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .logo-icon i {
            font-size: 32px;
            color: white;
        }
        .logo-title {
            font-size: 24px;
            font-weight: 600;
            color: #262626;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            color: #595959;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            height: 44px;
            border: 1px solid #D9D9D9;
            border-radius: 6px;
            padding: 0 16px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-input:focus {
            outline: none;
            border-color: #1890FF;
            box-shadow: 0 0 0 2px rgba(24,144,255,0.1);
        }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .remember-me input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .forgot-link {
            color: #1890FF;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }
        .btn-login {
            width: 100%;
            height: 44px;
            background: linear-gradient(135deg, #1890FF, #096DD9);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #096DD9, #0050B3);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(24,144,255,0.4);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .error-msg {
            color: #F5222D;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        .error-msg.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-area">
            <div class="logo-icon">
                <i class="fa-solid fa-leaf"></i>
            </div>
            <div class="logo-title">能碳管理平台</div>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">账号</label>
                <input type="text" class="form-input" id="username" placeholder="请输入手机号/邮箱/用户名" autocomplete="off">
                <div class="error-msg" id="usernameError">请输入账号</div>
            </div>
            
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" class="form-input" id="password" placeholder="请输入密码">
                <div class="error-msg" id="passwordError">请输入密码</div>
            </div>
            
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <span class="text-sm text-gray-600">记住密码</span>
                </label>
                <a class="forgot-link">忘记密码？</a>
            </div>
            
            <button type="submit" class="btn-login" id="loginBtn">
                登 录
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            
            // 清除错误状态
            document.querySelectorAll('.error-msg').forEach(el => el.classList.remove('show'));
            
            // 简单验证
            let hasError = false;
            if (!username) {
                document.getElementById('usernameError').classList.add('show');
                hasError = true;
            }
            if (!password) {
                document.getElementById('passwordError').classList.add('show');
                hasError = true;
            }
            
            if (hasError) return;
            
            // 模拟登录
            loginBtn.textContent = '登录中...';
            loginBtn.style.opacity = '0.7';
            
            setTimeout(() => {
                // 演示账号直接跳转
                if (username === 'admin' && password === 'admin123') {
                    window.location.href = 'P02-dashboard.html';
                } else {
                    loginBtn.textContent = '登录';
                    loginBtn.style.opacity = '1';
                    alert('账号或密码错误，请重试！');
                }
            }, 1000);
        });
        
        // 回车键登录
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
