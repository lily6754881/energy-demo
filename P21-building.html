<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建筑管理 - 能碳管理平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #F5F5F5; }
        .sidebar { width: 220px; background: #001529; position: fixed; height: 100vh; overflow-y: auto; z-index: 100; }
        .sidebar-logo { height: 64px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-logo i { font-size: 24px; color: #52C41A; margin-right: 10px; }
        .sidebar-logo span { color: white; font-size: 16px; font-weight: 600; }
        .sidebar-menu { padding: 12px 0; }
        .menu-group { margin-bottom: 4px; }
        .menu-group-header { padding: 10px 20px; color: rgba(255,255,255,0.45); font-size: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s; user-select: none; }
        .menu-group-header:hover { color: rgba(255,255,255,0.8); }
        .menu-group-header.active { color: white; }
        .menu-arrow { font-size: 10px; transition: transform 0.3s; }
        .menu-arrow.active { transform: rotate(90deg); }
        .menu-group-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .menu-group-content.open { max-height: 500px; }
        .sidebar-item { padding: 10px 20px 10px 48px; color: rgba(255,255,255,0.65); cursor: pointer; display: flex; align-items: center; transition: all 0.3s; font-size: 14px; }
        .sidebar-item:hover { background: rgba(255,255,255,0.08); color: white; }
        .sidebar-item.active { background: #1890FF; color: white; }
        .sidebar-item i { width: 20px; margin-right: 10px; font-size: 14px; }
        .main-content { margin-left: 220px; min-height: 100vh; }
        .topbar { height: 64px; background: white; border-bottom: 1px solid #E8E8E8; display: flex; align-items: center; padding: 0 24px; }
        .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .breadcrumb span { color: #262626; }
        .user-avatar { width: 36px; height: 36px; background: linear-gradient(135deg, #1890FF, #52C41A); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; cursor: pointer; margin-left: auto; }
        .page-content { padding: 24px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
        .card-header { padding: 16px 20px; border-bottom: 1px solid #E8E8E8; display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 16px; font-weight: 600; color: #262626; }
        .card-body { padding: 20px; }
        .btn { height: 36px; padding: 0 20px; border-radius: 6px; font-size: 14px; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 6px; border: none; }
        .btn-primary { background: #1890FF; color: white; }
        .tree-item { padding: 8px 12px; cursor: pointer; border-radius: 4px; transition: all 0.3s; }
        .tree-item:hover { background: #F5F5F5; }
        .tree-item.active { background: #E6F7FF; color: #1890FF; }
        .tree-children { padding-left: 24px; }
        .detail-panel { background: #FAFAFA; border-radius: 8px; padding: 20px; }
        .detail-row { display: flex; margin-bottom: 12px; }
        .detail-label { width: 100px; color: #8C8C8C; font-size: 14px; }
        .detail-value { flex: 1; color: #262626; font-size: 14px; }
        .quick-action { display: inline-block; padding: 4px 12px; background: white; border: 1px solid #D9D9D9; border-radius: 4px; margin-right: 8px; margin-top: 8px; cursor: pointer; font-size: 13px; color: #595959; transition: all 0.3s; }
        .quick-action:hover { border-color: #1890FF; color: #1890FF; }
    </style>
</head>
<body>
    <!-- 侧边栏导航 -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-logo"><i class="fa-solid fa-leaf"></i><span>能碳管理平台</span></div>
        <div class="sidebar-menu" id="nav-container"></div>
    </aside>
    <script src="sidebar-nav.js"></script>
    <div class="main-content">
        <div class="topbar">
            <div class="breadcrumb"><a href="P02-dashboard.html"><i class="fa-solid fa-home"></i></a><span>/</span><span>系统管理</span><span>/</span><span>建筑管理</span></div>
            <div class="user-avatar">管</div>
        </div>
        <div class="page-content">
            <div class="grid grid-cols-3 gap-6">
                <div class="col-span-1">
                    <div class="card" style="height:100%;">
                        <div class="card-header"><span class="card-title">楼栋树形列表</span><button class="btn btn-primary" style="height:32px;padding:0 12px;font-size:13px;"><i class="fa-solid fa-plus"></i> 新增</button></div>
                        <div class="card-body">
                            <div class="tree-item active"><i class="fa-solid fa-city text-blue-500 mr-2"></i> 园区A</div>
                            <div class="tree-item" style="padding-left:32px;"><i class="fa-solid fa-building text-orange-500 mr-2"></i> A栋（办公楼）</div>
                            <div class="tree-item" style="padding-left:56px;"><i class="fa-solid fa-layer-group text-gray-400 mr-2"></i> 1层（接待区）</div>
                            <div class="tree-item" style="padding-left:80px;"><i class="fa-solid fa-door-open text-gray-400 mr-2"></i> 1-101（A公司）</div>
                            <div class="tree-item" style="padding-left:80px;"><i class="fa-solid fa-door-open text-gray-400 mr-2"></i> 1-102（B公司）</div>
                            <div class="tree-item" style="padding-left:56px;"><i class="fa-solid fa-layer-group text-gray-400 mr-2"></i> 2层（办公区）</div>
                            <div class="tree-item" style="padding-left:80px;"><i class="fa-solid fa-door-open text-gray-400 mr-2"></i> 2-201（A公司）</div>
                            <div class="tree-item" style="padding-left:32px;"><i class="fa-solid fa-building text-orange-500 mr-2"></i> B栋（商业楼）</div>
                        </div>
                    </div>
                </div>
                <div class="col-span-2">
                    <div class="card">
                        <div class="card-header"><span class="card-title">楼栋详情</span></div>
                        <div class="card-body">
                            <div class="detail-panel">
                                <div class="detail-row"><span class="detail-label">楼栋名称</span><span class="detail-value font-medium">A栋</span></div>
                                <div class="detail-row"><span class="detail-label">楼栋编号</span><span class="detail-value">BLD-001</span></div>
                                <div class="detail-row"><span class="detail-label">楼栋类型</span><span class="detail-value">办公楼</span></div>
                                <div class="detail-row"><span class="detail-label">建筑面积</span><span class="detail-value">5,000 m²</span></div>
                                <div class="detail-row"><span class="detail-label">地上层数</span><span class="detail-value">10层</span></div>
                                <div class="detail-row"><span class="detail-label">地下层数</span><span class="detail-value">2层</span></div>
                                <div class="detail-row"><span class="detail-label">监测点数</span><span class="detail-value text-blue-500 font-medium">12个</span></div>
                                <div class="detail-row"><span class="detail-label">租户数</span><span class="detail-value text-green-500 font-medium">5个</span></div>
                                <div class="detail-row"><span class="detail-label">设备数</span><span class="detail-value text-orange-500 font-medium">15个</span></div>
                            </div>
                            <div class="mt-6"><span class="quick-action"><i class="fa-solid fa-pen"></i> 编辑楼栋</span><span class="quick-action"><i class="fa-solid fa-layer-group"></i> 配置区域</span><span class="quick-action"><i class="fa-solid fa-chart-line"></i> 查看能耗</span><span class="quick-action"><i class="fa-solid fa-microchip"></i> 查看设备</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
